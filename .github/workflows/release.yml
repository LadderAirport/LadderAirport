name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 只允许一个发布在跑，防止重复触发导致重复发版
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  CGO_ENABLED: "0"
  AGENT_TAGS: with_quic,with_utls
  # 注意：SINGBOX_VERSION 不在此处硬编码。其唯一来源是 agent/sing-box 子模块的
  # git tag，由 Resolve version 步骤用 `git -C agent/sing-box describe --tags`
  # 派生（与根 Makefile 保持一致）。

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            panel/go.sum
            agent/go.sum
            proto/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (embed into panel)
        run: make web

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)"
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # sing-box 版本唯一来源：agent/sing-box 子模块 tag（v1.12.22 → 1.12.22），同 Makefile
          SINGBOX="$(git -C agent/sing-box describe --tags 2>/dev/null || echo unknown)"
          SINGBOX="${SINGBOX#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT}" >> "$GITHUB_OUTPUT"
          echo "singbox_version=${SINGBOX}" >> "$GITHUB_OUTPUT"
          echo "Building VERSION=${VERSION} COMMIT=${COMMIT} SINGBOX=${SINGBOX}"

      - name: Build all targets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_COMMIT: ${{ steps.ver.outputs.commit }}
          BUILD_TIME: ${{ steps.ver.outputs.built_at }}
          SINGBOX_VERSION: ${{ steps.ver.outputs.singbox_version }}
        run: |
          mkdir -p dist
          VERSION_LDFLAGS="-X github.com/ladderairport/agent/internal/version.Version=${VERSION}"
          VERSION_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.Commit=${GIT_COMMIT}"
          VERSION_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.BuiltAt=${BUILD_TIME}"
          VERSION_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Version=${VERSION}"
          VERSION_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Commit=${GIT_COMMIT}"
          VERSION_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.BuiltAt=${BUILD_TIME}"
          AGENT_LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION} ${VERSION_LDFLAGS}"
          PANEL_LDFLAGS="-s -w ${VERSION_LDFLAGS}"

          # armhf 为 GOARCH=arm GOARM=7，发布文件名后缀是 linux-armhf。
          for pair in linux/amd64 linux/arm64 linux/armhf; do
            GOOS="${pair%/*}"
            SUFFIX="${pair#*/}"
            GOARCH="${SUFFIX}"
            GOARM=""
            if [[ "${SUFFIX}" == "armhf" ]]; then
              GOARCH="arm"
              GOARM="7"
            fi
            echo "==> $GOOS/$GOARCH suffix=${SUFFIX} version=${VERSION}"
            (cd panel && GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM go build -trimpath -ldflags="${PANEL_LDFLAGS}" \
              -o ../dist/panel-${GOOS}-${SUFFIX} ./cmd/panel)
            (cd agent && GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM go build -trimpath -tags "${AGENT_TAGS}" \
              -ldflags="-s -w ${AGENT_LDFLAGS}" \
              -o ../dist/ladder-agent-${GOOS}-${SUFFIX} ./cmd/ladder-agent)
          done
          cp scripts/install-panel.sh dist/
          cp scripts/install-agent.sh dist/
          chmod 0755 dist/*.sh
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la
          # smoke: ensure version string is in the linux/amd64 agent binary
          if command -v strings >/dev/null; then
            strings ladder-agent-linux-amd64 | grep -F "${VERSION}" | head -3 || true
          fi

      # 仅在 tag 推送时发布；workflow_dispatch 手动触发只构建验证，不创建 Release
      # （dispatch 无 tag，action-gh-release 会失败）
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/panel-linux-amd64
            dist/panel-linux-arm64
            dist/panel-linux-armhf
            dist/ladder-agent-linux-amd64
            dist/ladder-agent-linux-arm64
            dist/ladder-agent-linux-armhf
            dist/install-panel.sh
            dist/install-agent.sh
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
