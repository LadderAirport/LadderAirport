name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  CGO_ENABLED: "0"
  AGENT_TAGS: with_quic,with_utls
  # 注意：SINGBOX_VERSION 不在此处硬编码。其唯一来源是 agent/sing-box 子模块的
  # git tag，由各 job 的 Resolve version 步骤用
  # `git -C agent/sing-box describe --tags` 派生（与根 Makefile 保持一致）。

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            panel/go.sum
            agent/go.sum
            proto/go.sum

      - name: Test pkg
        run: cd pkg && go test ./...

      - name: Test panel
        run: cd panel && go test ./...

      - name: Test agent
        run: cd agent && go test -tags "${AGENT_TAGS}" ./... -timeout 120s

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: amd64
          - goos: linux
            goarch: arm64
            suffix: arm64
          # armhf：GOARCH=arm、GOARM=7（Debian/Raspbian 硬浮点）。产物后缀用 armhf，
          # 避免变成 linux-arm，安装脚本才能按 uname 对上文件名。
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: armhf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            panel/go.sum
            agent/go.sum
            proto/go.sum

      - name: Resolve version
        id: ver
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-ci)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # sing-box 版本唯一来源：agent/sing-box 子模块 tag（v1.12.22 → 1.12.22），同 Makefile
          SINGBOX="$(git -C agent/sing-box describe --tags 2>/dev/null || echo unknown)"
          SINGBOX="${SINGBOX#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT}" >> "$GITHUB_OUTPUT"
          echo "singbox_version=${SINGBOX}" >> "$GITHUB_OUTPUT"

      - name: Build panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_COMMIT: ${{ steps.ver.outputs.commit }}
          BUILD_TIME: ${{ steps.ver.outputs.built_at }}
        run: |
          mkdir -p dist
          PANEL_LDFLAGS="-s -w"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Version=${VERSION}"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Commit=${GIT_COMMIT}"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.BuiltAt=${BUILD_TIME}"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.Version=${VERSION}"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.Commit=${GIT_COMMIT}"
          PANEL_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.BuiltAt=${BUILD_TIME}"
          cd panel
          go build -trimpath -ldflags="${PANEL_LDFLAGS}" -o ../dist/panel-${{ matrix.goos }}-${{ matrix.suffix }} ./cmd/panel

      - name: Build ladder-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_COMMIT: ${{ steps.ver.outputs.commit }}
          BUILD_TIME: ${{ steps.ver.outputs.built_at }}
          SINGBOX_VERSION: ${{ steps.ver.outputs.singbox_version }}
        run: |
          AGENT_LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${SINGBOX_VERSION}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.Version=${VERSION}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.Commit=${GIT_COMMIT}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/agent/internal/version.BuiltAt=${BUILD_TIME}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Version=${VERSION}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.Commit=${GIT_COMMIT}"
          AGENT_LDFLAGS+=" -X github.com/ladderairport/panel/internal/version.BuiltAt=${BUILD_TIME}"
          cd agent
          go build -trimpath -tags "${AGENT_TAGS}" \
            -ldflags="-s -w ${AGENT_LDFLAGS}" \
            -o ../dist/ladder-agent-${{ matrix.goos }}-${{ matrix.suffix }} ./cmd/ladder-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Optional frontend check when web/ changes (panel embeds committed dist)
  web:
    name: Web build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify embedded frontend is current
        run: diff -qr web/dist panel/web/dist

  # E2E smoke：构建产物后在 runner 本地起 panel+agent 跑 scripts/e2e-smoke.sh。
  # 脚本内 ADMIN_PASS 为显式测试值，Agent 经 Panel PKI 注册签发证书，不依赖任何外部配置。
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            pkg/go.sum
            panel/go.sum
            agent/go.sum
            proto/go.sum

      - name: Run e2e smoke (panel + agent)
        run: make e2e

  # 轻量 proto 兼容检查：agent.proto 在 PR 中变更时提醒人工 review 字段号（非阻断）
  proto-review:
    name: Proto field-number review reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect agent.proto changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^proto/agent/v1/agent\.proto$'; then
            echo "::warning file=proto/agent/v1/agent.proto::agent.proto 发生变更：请人工 review 字段号兼容性（已发布字段不得改号/复用/删号；新字段用新编号；删除字段请 reserve）"
          else
            echo "agent.proto 无变更"
          fi
