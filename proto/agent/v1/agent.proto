syntax = "proto3";

package agent.v1;

option go_package = "github.com/ladderairport/proto/gen/go/agent/v1;agentv1";

service AgentControl {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  // UpgradeAgent downloads a release binary to the upgrade staging dir so a
  // root-owned systemd path unit can replace /usr/local/bin/ladder-agent and restart.
  // The RPC returns after staging (before restart). Panel should re-probe for the new version.
  rpc UpgradeAgent(UpgradeAgentRequest) returns (UpgradeAgentResponse);
  rpc ProbeOutbound(ProbeOutboundRequest) returns (ProbeOutboundResponse);
  rpc GetPublicAddresses(GetPublicAddressesRequest) returns (GetPublicAddressesResponse);
  rpc PrepareProtocolCertificate(PrepareProtocolCertificateRequest) returns (PrepareProtocolCertificateResponse);
  rpc InstallProtocolCertificate(InstallProtocolCertificateRequest) returns (InstallProtocolCertificateResponse);
  rpc GetProtocolCertificateStatus(GetProtocolCertificateStatusRequest) returns (GetProtocolCertificateStatusResponse);
  rpc DeleteProtocolCertificateGeneration(DeleteProtocolCertificateGenerationRequest) returns (DeleteProtocolCertificateGenerationResponse);
  rpc ApplyFRPServerConfig(ApplyFRPServerConfigRequest) returns (ApplyFRPServerConfigResponse);
  rpc StartFRPServer(StartFRPServerRequest) returns (StartFRPServerResponse);
  rpc StopFRPServer(StopFRPServerRequest) returns (StopFRPServerResponse);
  rpc GetFRPServerStatus(GetFRPServerStatusRequest) returns (GetFRPServerStatusResponse);
  rpc GetFRPServerMappings(GetFRPServerMappingsRequest) returns (GetFRPServerMappingsResponse);
  // GetNodeMetrics returns system-level node metrics (CPU/memory/disk/network rates).
  // Requires agent capability "node-metrics-v1"; panels MUST tolerate Unimplemented.
  rpc GetNodeMetrics(GetNodeMetricsRequest) returns (GetNodeMetricsResponse);
  // GetBBRStatus reports kernel TCP congestion-control state (BBR availability).
  // Requires agent capability "bbr-v1"; panels MUST tolerate Unimplemented.
  rpc GetBBRStatus(GetBBRStatusRequest) returns (GetBBRStatusResponse);
  // SetBBR enables/disables BBR congestion control on the node.
  // Requires agent capability "bbr-v1"; panels MUST tolerate Unimplemented.
  rpc SetBBR(SetBBRRequest) returns (SetBBRResponse);
}

message PingRequest {}
message PingResponse {
  string agent_version = 1;
  string singbox_version = 2;
  repeated string capabilities = 3;
  string frps_version = 4;
  // Core identity is the upstream ladder-agent build. agent_version stays
  // equal to core_version so older panels keep a single comparable version.
  // Wrapper identity (Android APK, OpenWrt package, LuCI) is separate and
  // must not be written into agent_version.
  string core_version = 5;
  string core_commit = 6;
  string client_type = 7;
  string client_version = 8;
  string luci_version = 9;
}

message FRPServerPortRange {
  uint32 start = 1;
  uint32 end = 2;
}

message FRPServerConfig {
  bool enabled = 1;
  string bind_addr = 2;
  uint32 bind_port = 3;
  string proxy_bind_addr = 4;
  repeated FRPServerPortRange allow_ports = 5;
  string auth_token = 6;
  bool tls_force = 7;
  int64 max_ports_per_client = 8;
}

message ApplyFRPServerConfigRequest {
  FRPServerConfig config = 1;
  string config_hash = 2;
}

message ApplyFRPServerConfigResponse {
  bool ok = 1;
  string message = 2;
  string applied_hash = 3;
}

message StartFRPServerRequest {}
message StartFRPServerResponse {
  bool ok = 1;
  string message = 2;
}

message StopFRPServerRequest {}
message StopFRPServerResponse {
  bool ok = 1;
  string message = 2;
}

message GetFRPServerStatusRequest {}
message GetFRPServerStatusResponse {
  string state = 1; // running | stopped | error
  string config_hash = 2;
  int64 started_at_unix = 3;
  string last_error = 4;
  string frps_version = 5;
}

message GetFRPServerMappingsRequest {}

message FRPServerClient {
  string key = 1;
  string user = 2;
  string client_id = 3;
  string run_id = 4;
  string version = 5;
  string wire_protocol = 6; // frp wire protocol version: v1 | v2
  string hostname = 7;
  string client_ip = 8;
  int64 connected_at_unix = 9;
  bool online = 10;
}

message FRPServerMapping {
  string name = 1;
  string type = 2;   // proxy type: tcp | udp | http | https | tcpmux | stcp | xtcp | sudp
  string status = 3; // frps admin status, e.g. online | offline
  string user = 4;
  string client_id = 5;
  string local_ip = 6;
  uint32 local_port = 7;
  uint32 remote_port = 8;
  repeated string custom_domains = 9;
  string subdomain = 10;
  int64 current_connections = 11;
  int64 traffic_in_bytes = 12;
  int64 traffic_out_bytes = 13;
  string last_start_time = 14;
  string plugin = 15;
}

message GetFRPServerMappingsResponse {
  repeated FRPServerClient clients = 1;
  repeated FRPServerMapping mappings = 2;
  int64 collected_at_unix = 3;
}

message ProbeOutboundRequest {
  string outbound_tag = 1;
  string url = 2;
}

message ProbeOutboundResponse {
  bool ok = 1;
  uint32 delay_ms = 2;
  string message = 3;
}

message ApplyConfigRequest {
  string config_json = 1;
  string config_hash = 2;
  bool replace = 3;
}
message ApplyConfigResponse {
  bool ok = 1;
  string message = 2;
  string applied_hash = 3;
}

message StartRequest {}
message StartResponse {
  bool ok = 1;
  string message = 2;
}
message StopRequest {}
message StopResponse {
  bool ok = 1;
  string message = 2;
}

message GetStatusRequest {}
message GetStatusResponse {
  string state = 1; // running | stopped | error
  string config_hash = 2;
  int64 started_at_unix = 3;
  string last_error = 4;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  int64 connections = 1;
  int64 uplink_bytes = 2;
  int64 downlink_bytes = 3;
  double cpu_percent = 4;
  int64 memory_rss_bytes = 5;
}

message StreamLogsRequest {
  string level = 1; // optional filter: debug|info|warn|error
  int32 tail = 2;   // lines from ring buffer before live
}
message LogLine {
  int64 ts_unix_ms = 1;
  string level = 2; // debug | info | warn | error
  string message = 3;
}

message ListInterfacesRequest {}

message NetworkInterface {
  string name = 1;
  repeated string addresses = 2;
  bool up = 3;
  bool loopback = 4;
  int32 mtu = 5;
  string hardware_addr = 6;
}

message ListInterfacesResponse {
  repeated NetworkInterface interfaces = 1;
}

message UpgradeAgentRequest {
  // Target release tag, e.g. "v0.7.1". Empty or "latest" resolves GitHub latest.
  string version = 1;
  // Optional GitHub owner/repo override (default LadderAirport/LadderAirport).
  string repo = 2;
  // Optional direct download URL for the linux binary (skips GitHub resolution).
  string download_url = 3;
  // Optional expected SHA-256 hex of the binary.
  string sha256 = 4;
}

message UpgradeAgentResponse {
  bool ok = 1;
  string message = 2;
  // Resolved version/tag when known.
  string version = 3;
  // Absolute path of the staged binary (before helper applies it).
  string staged_path = 4;
  // Previous agent version string reported by this process.
  string previous_version = 5;
}

message GetPublicAddressesRequest {
  bool ipv4 = 1;
  bool ipv6 = 2;
}

message GetPublicAddressesResponse {
  string ipv4 = 1;
  string ipv6 = 2;
  repeated string ipv4_sources = 3;
  repeated string ipv6_sources = 4;
  repeated string warnings = 5;
}

message PrepareProtocolCertificateRequest {
  string certificate_id = 1;
  string generation_id = 2;
  repeated string dns_names = 3;
}

message PrepareProtocolCertificateResponse {
  string key_id = 1;
  string csr_pem = 2;
  string public_key_fingerprint = 3;
}

message InstallProtocolCertificateRequest {
  string certificate_id = 1;
  string generation_id = 2;
  string key_id = 3;
  string certificate_pem = 4;
  repeated string dns_names = 5;
}

message InstallProtocolCertificateResponse {
  string certificate_path = 1;
  string key_path = 2;
  string fingerprint = 3;
  string serial = 4;
  int64 not_before_unix = 5;
  int64 not_after_unix = 6;
}

message GetProtocolCertificateStatusRequest {
  string certificate_id = 1;
  string generation_id = 2;
}

message GetProtocolCertificateStatusResponse {
  bool key_exists = 1;
  bool certificate_exists = 2;
  string key_id = 3;
  string certificate_path = 4;
  string key_path = 5;
  string fingerprint = 6;
  int64 not_after_unix = 7;
}

message DeleteProtocolCertificateGenerationRequest {
  string certificate_id = 1;
  string generation_id = 2;
}

message DeleteProtocolCertificateGenerationResponse {
  bool ok = 1;
  string message = 2;
}

// GetNodeMetrics: system-level node metrics.
// Requires agent capability "node-metrics-v1"; panels MUST tolerate Unimplemented.
message GetNodeMetricsRequest {}
message GetNodeMetricsResponse {
  double cpu_percent = 1;          // whole-machine CPU usage percent (0-100)
  uint64 memory_total_bytes = 2;
  uint64 memory_used_bytes = 3;
  uint64 disk_total_bytes = 4;
  uint64 disk_used_bytes = 5;
  uint64 uplink_bps = 6;           // send rate over the sampling interval, bits/s
  uint64 downlink_bps = 7;         // receive rate over the sampling interval, bits/s
  int64 collected_at_unix = 8;     // sample timestamp (unix seconds)
}

// GetBBRStatus: kernel congestion-control introspection.
// Requires agent capability "bbr-v1"; panels MUST tolerate Unimplemented.
message GetBBRStatusRequest {}
message GetBBRStatusResponse {
  bool bbr_available = 1;                    // kernel supports BBR
  bool bbr_enabled = 2;                      // BBR is the active default congestion control
  string current_congestion_control = 3;     // net.ipv4.tcp_congestion_control, e.g. cubic | bbr
  string current_qdisc = 4;                  // net.core.default_qdisc, e.g. fq | fq_codel | pfifo_fast
  repeated string supported_controls = 5;    // net.ipv4.tcp_available_congestion_control
}

// SetBBR: toggle BBR congestion control.
// Requires agent capability "bbr-v1"; panels MUST tolerate Unimplemented.
message SetBBRRequest {
  bool enabled = 1;
}
message SetBBRResponse {
  bool ok = 1;
  string message = 2;
}
